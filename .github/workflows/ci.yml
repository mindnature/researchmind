name: ResearchMind CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all scholar datasets
        run: python scripts/researchmind.py validate
      - name: Show repository stats
        run: python scripts/researchmind.py stats
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Pauling reference advisor
        run: python scripts/researchmind.py build-skill --scholar pauling --output /tmp/pauling-research-advisor
